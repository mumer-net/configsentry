name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest -q
      - name: Seeded-fault detection rate
        shell: bash  # enables pipefail, so a failing selftest fails the job
        run: uv run configsentry selftest --markdown | tee -a "$GITHUB_STEP_SUMMARY"
